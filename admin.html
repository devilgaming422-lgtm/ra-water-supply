<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RA Water Supply Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f8fb;color:#14212b}.top{background:#087fce;color:white;padding:18px}.wrap{max-width:1100px;margin:auto;padding:15px}.card{background:white;border-radius:15px;padding:17px;margin:12px 0;box-shadow:0 3px 15px #0001}input,select{padding:11px;border:1px solid #ccd8df;border-radius:9px;width:100%;margin:5px 0 10px}.btn{border:0;border-radius:9px;padding:11px 14px;background:#087fce;color:white;font-weight:700;cursor:pointer}.danger{background:#c62828}.muted{color:#6d7c84;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#eef7fc;border-radius:12px;padding:15px}.stat b{font-size:25px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px}th,td{padding:10px;border-bottom:1px solid #e7edf0;text-align:left;font-size:14px}.status{padding:6px;border-radius:7px}.hidden{display:none}.login{max-width:420px;margin:50px auto}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}
</style></head>
<body>
<div class="top"><b>💧 RA WATER SUPPLY — ADMIN PANEL</b></div>
<div class="wrap">
<section id="login" class="card login"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button class="btn" onclick="login()">Login</button><p id="loginErr" class="muted"></p></section>
<section id="panel" class="hidden">
<div class="card"><button class="btn danger" onclick="logout()">Logout</button> <button class="btn" onclick="loadAll()">Refresh</button></div>
<div class="grid"><div class="stat">Total Orders<br><b id="sTotal">0</b></div><div class="stat">Pending<br><b id="sPending">0</b></div><div class="stat">Delivered<br><b id="sDelivered">0</b></div><div class="stat">Sales<br><b id="sSales">₹0</b></div></div>

<div class="card"><h2>Orders</h2><input id="search" placeholder="Search order / customer / phone" oninput="renderOrders()"><div class="tablewrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Date</th></tr></thead><tbody id="orders"></tbody></table></div></div>

<div class="card"><h2>Promo Management</h2><div class="grid">
<div><input id="pcode" placeholder="Code e.g. RA20"></div><div><select id="ptype"><option value="flat">₹ Flat</option><option value="percent">% Percent</option></select></div><div><input id="pvalue" type="number" placeholder="Discount"></div><div><input id="pmin" type="number" placeholder="Minimum order"></div></div><button class="btn" onclick="addPromo()">Add Promo</button><div class="tablewrap"><table><thead><tr><th>Code</th><th>Discount</th><th>Min</th><th>Active</th><th>Action</th></tr></thead><tbody id="promos"></tbody></table></div></div>
</section></div>
<script>
const SUPABASE_URL="https://ganlpybastoxjnelsxmq.supabase.co",SUPABASE_ANON_KEY="sb_publishable_T9Rvnl8JP_mCA77gX6zSLg_vlrgmuTZ";const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let orders=[];
async function login(){let {error}=await db.auth.signInWithPassword({email:email.value,password:password.value});if(error){loginErr.textContent=error.message;return}start()}
async function start(){let {data:{session}}=await db.auth.getSession();if(!session)return;login.classList.add("hidden");panel.classList.remove("hidden");loadAll()}
async function logout(){await db.auth.signOut();location.reload()}
async function loadAll(){let o=await db.from("orders").select("*").order("created_at",{ascending:false});if(o.error)return alert(o.error.message);orders=o.data;renderStats();renderOrders();let p=await db.from("promos").select("*").order("created_at",{ascending:false});if(!p.error)renderPromos(p.data)}
function renderStats(){sTotal.textContent=orders.length;sPending.textContent=orders.filter(x=>x.status==="Pending").length;sDelivered.textContent=orders.filter(x=>x.status==="Delivered").length;sSales.textContent="₹"+orders.filter(x=>x.status!=="Cancelled").reduce((a,x)=>a+Number(x.total),0)}
function renderOrders(){let q=(search.value||"").toLowerCase();let list=orders.filter(o=>(o.order_no+" "+o.customer_name+" "+o.phone).toLowerCase().includes(q));document.getElementById("orders").innerHTML=list.map(o=>`<tr><td><b>${o.order_no}</b></td><td>${esc(o.customer_name)}<br>${o.phone}<br><span class="muted">${esc(o.address)}</span></td><td>${(o.items||[]).map(i=>i.floor+" × "+i.qty).join("<br>")}</td><td><b>₹${o.total}</b></td><td>${o.payment_method}</td><td><select onchange="changeStatus('${o.id}',this.value)">${["Pending","Accepted","Out for Delivery","Delivered","Cancelled"].map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></td><td>${new Date(o.created_at).toLocaleString()}</td></tr>`).join("")}
async function changeStatus(id,status){let {error}=await db.from("orders").update({status}).eq("id",id);if(error)alert(error.message);else loadAll()}
async function addPromo(){let code=pcode.value.trim().toUpperCase(),type=ptype.value,value=Number(pvalue.value),min=Number(pmin.value||0);if(!code||!value)return alert("Enter promo details.");let {error}=await db.from("promos").insert({code,discount_type:type,discount_value:value,min_order:min,active:true});if(error)alert(error.message);else{pcode.value="";pvalue.value="";pmin.value="";loadAll()}}
function renderPromos(ps){promos.innerHTML=ps.map(p=>`<tr><td><b>${p.code}</b></td><td>${p.discount_type==="flat"?"₹":"%"}${p.discount_value}</td><td>₹${p.min_order}</td><td>${p.active?"Yes":"No"}</td><td><button class="btn" onclick="togglePromo('${p.id}',${!p.active})">${p.active?"Disable":"Enable"}</button></td></tr>`).join("")}
async function togglePromo(id,active){let {error}=await db.from("promos").update({active}).eq("id",id);if(error)alert(error.message);else loadAll()}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
start();
</script></body></html>
